server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    if ($host = www.kti.ae) { return 301 https://kti.ae$request_uri; }
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # HTTPS is terminated by EasyPanel/Traefik. Do not set a premature
    # includeSubDomains HSTS directive: Starlink has separate hosting.

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nAllow: /\nSitemap: https://kti.ae/sitemap.xml\n"; }
    location = /sitemap.xml { default_type application/xml; return 200 '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://kti.ae/</loc></url><url><loc>https://kti.ae/privacy.html</loc></url><url><loc>https://kti.ae/terms.html</loc></url></urlset>'; }
    location /assets/ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
    location ~* \.(?:css|js)$ { expires 10m; add_header Cache-Control "public, must-revalidate"; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
